<!--ნებისმიერი api ის გამოყენებით ააწყვეთ მინი პროექტი სადაც გამოიყენებთ async await და try catch ბლოკებს -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Fetcher</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f4f7fb;
        color: #333;
      }
      .card {
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        max-width: 500px;
        width: 100%;
        text-align: center;
      }
      button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #4a90e2;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin-top: 16px;
      }
      button:hover {
        background: #4178c0;
      }
      #joke {
        font-size: 18px;
        line-height: 1.6;
        margin-top: 16px;
      }
      #error {
        color: #c0392b;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Random Joke Fetcher</h1>
      <p>
        Click the button to load a joke from the Chuck Norris API using
        async/await and try/catch.
      </p>
      <button id="fetchButton">Get a Joke</button>
      <div id="joke">Press the button to see a joke.</div>
      <div id="error"></div>
    </div>

    <script>
      const button = document.getElementById('fetchButton');
      const jokeContainer = document.getElementById('joke');
      const errorContainer = document.getElementById('error');

      button.addEventListener('click', async () => {
        await loadJoke();
      });

      async function loadJoke() {
        const apiUrl = 'https://api.chucknorris.io/jokes/random';
        jokeContainer.textContent = 'Loading joke...';
        errorContainer.textContent = '';

        try {
          const response = await fetch(apiUrl);
          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }
          const data = await response.json();
          jokeContainer.textContent = data.value;
        } catch (error) {
          jokeContainer.textContent = 'Unable to load joke.';
          errorContainer.textContent = `Error: ${error.message}`;
          console.error('Fetch error:', error);
        }
      }
    </script>
  </body>
</html>
