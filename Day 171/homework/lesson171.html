<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmospheric Weather Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --bg-glass: rgba(16, 28, 34, 0.45);
        --border-glass: rgba(255, 255, 255, 0.08);
        --text-main: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.65);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d151c;
        color: var(--text-main);
      }

      /* Dashboard Container Split */
      .dashboard {
        display: flex;
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      /* Left Visual Panel */
      .visual-panel {
        flex: 1.6;
        position: relative;
        background-size: cover;
        background-position: center;
        transition: background-image 0.8s ease-in-out;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 50px;
        z-index: 1;
      }

      /* Ambient Bokeh Overlay matching the image */
      .visual-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(
            circle at 60% 30%,
            rgba(255, 255, 255, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 30% 70%,
            rgba(255, 255, 255, 0.1) 0%,
            transparent 30%
          );
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      /* Floating Atmosphere Particles */
      .bokeh-particle {
        position: absolute;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        filter: blur(8px);
        pointer-events: none;
        animation: floatAmbient 12s infinite ease-in-out;
      }

      @keyframes floatAmbient {
        0%,
        100% {
          transform: translateY(0) translateX(0) scale(1);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-20px) translateX(15px) scale(1.1);
          opacity: 0.6;
        }
      }

      .logo {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -1px;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .logo span {
        color: #ffcc00;
      }

      .current-brief {
        display: flex;
        align-items: flex-end;
        gap: 25px;
      }

      .main-temp {
        font-size: 7.5rem;
        font-weight: 200;
        line-height: 0.9;
      }

      .location-box {
        margin-bottom: 10px;
      }

      .city-name {
        font-size: 2.8rem;
        font-weight: 400;
        margin-bottom: 4px;
      }

      .date-time {
        font-size: 0.95rem;
        color: var(--text-muted);
        font-weight: 300;
      }

      .main-weather-icon {
        font-size: 3rem;
        margin-bottom: 12px;
        opacity: 0.95;
      }

      /* Right Functional Panel */
      .details-panel {
        flex: 1;
        background: var(--bg-glass);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-left: 1px solid var(--border-glass);
        padding: 50px 45px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        z-index: 2;
        overflow-y: auto;
      }

      /* Custom Scrollbar for details panel */
      .details-panel::-webkit-scrollbar {
        width: 5px;
      }
      .details-panel::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }

      /* Search Section */
      .search-container {
        position: relative;
        width: 100%;
      }

      .search-input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        padding: 12px 40px 12px 0;
        color: var(--text-main);
        font-size: 1.05rem;
        font-weight: 300;
        outline: none;
        transition: border-color 0.3s;
      }

      .search-input:focus {
        border-bottom-color: var(--text-main);
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-btn {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-main);
        cursor: pointer;
        font-size: 1.1rem;
        opacity: 0.8;
        transition: opacity 0.2s;
      }

      .search-btn:hover {
        opacity: 1;
      }

      /* Weather Metric List */
      .section-title {
        font-size: 0.9rem;
        font-weight: 400;
        color: var(--text-muted);
        letter-spacing: 1px;
        margin-bottom: 25px;
      }

      .condition-headline {
        font-size: 1.15rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 25px;
      }

      .metric-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.05rem;
        font-weight: 300;
      }

      .metric-label {
        color: var(--text-muted);
      }

      .metric-value-box {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .metric-icon {
        width: 20px;
        text-align: center;
        font-size: 1.1rem;
      }

      .icon-max {
        color: #ff6b6b;
      }
      .icon-min {
        color: #4dadff;
      }
      .icon-humidity {
        color: #a1e3f9;
      }
      .icon-cloudy {
        color: #d2dae2;
      }
      .icon-wind {
        color: #78e08f;
      }

      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.15);
        margin: 10px 0;
      }

      /* Forecast Rows Layout */
      .forecast-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .forecast-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 0;
      }

      .forecast-left {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .forecast-icon {
        font-size: 1.4rem;
        width: 30px;
        text-align: center;
      }

      .forecast-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .forecast-time {
        font-size: 1rem;
        font-weight: 400;
      }

      .forecast-desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        text-transform: capitalize;
      }

      .forecast-temp {
        font-size: 1.1rem;
        font-weight: 400;
      }

      /* Responsive Design Adaptation */
      @media (max-width: 900px) {
        .dashboard {
          flex-direction: column;
          overflow-y: auto;
        }
        .visual-panel {
          flex: none;
          height: 50vh;
          padding: 30px;
        }
        .details-panel {
          flex: none;
          height: auto;
          padding: 35px 30px;
        }
        .main-temp {
          font-size: 5rem;
        }
        .city-name {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <div
        class="bokeh-particle"
        style="
          width: 120px;
          height: 120px;
          top: 15%;
          left: 45%;
          animation-delay: 0s;
        "
      ></div>
      <div
        class="bokeh-particle"
        style="
          width: 180px;
          height: 180px;
          top: 55%;
          left: 20%;
          animation-delay: -3s;
        "
      ></div>
      <div
        class="bokeh-particle"
        style="
          width: 90px;
          height: 90px;
          top: 30%;
          left: 10%;
          animation-delay: -6s;
        "
      ></div>

      <div
        class="visual-panel"
        id="visualPanel"
        style="
          background-image:
            linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.45)),
            url('https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?q=80&w=1600&auto=format&fit=crop');
        "
      >
        <div class="logo">WW<span>⚡</span></div>

        <div class="current-brief">
          <div class="main-temp" id="leftTemp">--°</div>
          <div class="location-box">
            <div class="city-name" id="leftCity">Loading...</div>
            <div class="date-time" id="leftDateTime">
              --:-- - --------, -- --- '--
            </div>
          </div>
          <div class="main-weather-icon" id="leftIcon">
            <i class="fa-solid fa-cloud"></i>
          </div>
        </div>
      </div>

      <div class="details-panel">
        <div class="search-container">
          <form id="searchForm">
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="Search Location..."
              autocomplete="off"
            />
            <button type="submit" class="search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>
        </div>

        <div>
          <div class="section-title">Weather Details...</div>
          <div class="condition-headline" id="conditionHeadline">CLEAR SKY</div>

          <div class="metric-list">
            <div class="metric-row">
              <span class="metric-label">Temp max</span>
              <div class="metric-value-box">
                <span id="valTempMax">--°</span>
                <span class="metric-icon icon-max"
                  ><i class="fa-solid fa-temperature-arrow-up"></i
                ></span>
              </div>
            </div>
            <div class="metric-row">
              <span class="metric-label">Temp min</span>
              <div class="metric-value-box">
                <span id="valTempMin">--°</span>
                <span class="metric-icon icon-min"
                  ><i class="fa-solid fa-temperature-arrow-down"></i
                ></span>
              </div>
            </div>
            <div class="metric-row">
              <span class="metric-label">Humidity</span>
              <div class="metric-value-box">
                <span id="valHumidity">--%</span>
                <span class="metric-icon icon-humidity"
                  ><i class="fa-solid fa-droplet"></i
                ></span>
              </div>
            </div>
            <div class="metric-row">
              <span class="metric-label">Cloudy</span>
              <div class="metric-value-box">
                <span id="valCloudy">--%</span>
                <span class="metric-icon icon-cloudy"
                  ><i class="fa-solid fa-cloud"></i
                ></span>
              </div>
            </div>
            <div class="metric-row">
              <span class="metric-label">Wind</span>
              <div class="metric-value-box">
                <span id="valWind">--km/h</span>
                <span class="metric-icon icon-wind"
                  ><i class="fa-solid fa-wind"></i
                ></span>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div>
          <div class="section-title">Today's Weather Forecast...</div>
          <div class="forecast-container" id="forecastContainer"></div>
        </div>
      </div>
    </div>

    <script>
      function fetchWeatherData(locationName) {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(locationName)}&count=1&language=en&format=json`;

        fetch(geoUrl)
          .then((geoRes) => {
            return geoRes.json();
          })

          .then((geoData) => {
            if (!geoData.results || geoData.results.length === 0) {
              throw new Error('Location not found. Please try another city.');
            }

            const location = geoData.results[0];

            const latitude = location.latitude;
            const longitude = location.longitude;
            const name = location.name;
            const country = location.country;

            const displayName = `${name}, ${country}`;

            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,cloud_cover,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&hourly=temperature_2m,weather_code&timezone=auto`;

            return fetch(weatherUrl)
              .then((weatherRes) => weatherRes.json())
              .then((weatherData) => {
                return {
                  displayName,
                  weatherData,
                };
              });
          })

          .then((data) => {
            renderDashboard(data.displayName, data.weatherData);
          })

          .catch((error) => {
            console.error(error);
            alert(error.message);
          })

          .finally(() => {
            console.log('Weather request finished.');
          });
      }
    </script>
  </body>
</html>
